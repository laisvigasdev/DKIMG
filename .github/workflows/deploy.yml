name: Azure Debian Image Setup

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-connect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Autenticar no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validar Conexão com o Azure
        run: |
          echo "Autenticado com sucesso no Azure!"
          az account show
